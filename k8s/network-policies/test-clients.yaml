apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  labels:
    app: allowed-client
    access: granted
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-client
  labels:
    app: blocked-client
    access: denied
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["sleep", "3600"]
