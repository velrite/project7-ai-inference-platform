apiVersion: v1
kind: Pod
metadata:
  name: target-app
  labels:
    app: target-app
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: target-app-svc
spec:
  selector:
    app: target-app
  ports:
    - port: 80
      targetPort: 80
