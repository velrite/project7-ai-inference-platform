apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference-cpu
  labels:
    app: vllm-inference-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference-cpu
  template:
    metadata:
      labels:
        app: vllm-inference-cpu
    spec:
      nodeSelector:
        pool: cpu-inference
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: vllm
          image: public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "4"
            - name: VLLM_ENABLE_V1_MULTIPROCESSING
              value: "0"
          args:
            - "--model=Qwen/Qwen2.5-1.5B-Instruct"
            - "--dtype=bfloat16"
            - "--max-model-len=4096"
            - "--enforce-eager"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "2500m"
              memory: "8Gi"
            limits:
              cpu: "3500m"
              memory: "12Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
