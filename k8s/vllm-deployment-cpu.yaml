apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference-cpu
  labels:
    app: vllm-inference-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference-cpu
  template:
    metadata:
      labels:
        app: vllm-inference-cpu
    spec:
      nodeSelector:
        pool: system
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model=Qwen/Qwen2.5-0.5B-Instruct"
            - "--dtype=float32"
            - "--max-model-len=4096"
            - "--device=cpu"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1500m"
              memory: "3Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
