apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protected-ingress
  annotations:
    # Rate limit: max 5 requests per second per client IP.
    # This is the real control preventing abuse of an expensive
    # inference endpoint - without this, one client could exhaust
    # GPU capacity for everyone.
    nginx.ingress.kubernetes.io/limit-rps: "5"
    # Reject any request body larger than 1MB - prevents
    # resource-exhaustion attacks via huge payloads.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-test-svc
                port:
                  number: 80
