name: CI Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-scan-sbom-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build -t vllm-inference:${{ github.sha }} ./app

      # Trivy scans the built image for known CVEs. Policy: fail the
      # pipeline on CRITICAL severity. HIGH/MEDIUM/LOW are reported
      # but do not block - this is a documented, explicit threshold,
      # not silent tolerance. Documented exceptions live in .trivyignore.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vllm-inference:${{ github.sha }}
          format: table
          severity: CRITICAL
          timeout: '15m0s'
          exit-code: 1
          vuln-type: os,library

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: vllm-inference:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # Install cosign for signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Sign the image using its exact digest, never a mutable tag.
      # Private key comes from a GitHub Actions secret, never committed.
      - name: Sign container image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          cosign sign --key cosign.key --yes vllm-inference:${{ github.sha }}
          rm -f cosign.key

      - name: Upload Trivy results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-log
          path: '*.json'
          if-no-files-found: ignore
